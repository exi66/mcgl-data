  - "@modelcontextprotocol/sdk@1.31.0"
  - baseline-browser-mapping@2.11.0
  - brace-expansion@1.1.21 || 5.0.12
  - braces@3.0.4
  - browserslist@4.28.7
  - esbuild@0.28.1
  - fast-uri@3.1.8
  - hono@4.13.5
  - ip-address@10.7.1
  - js-yaml@4.3.2
  - nanoid@3.3.18
  - postcss-selector-parser@7.1.3
  - proxy-addr@2.0.8
  - qs@6.16.0
  - source-map-js@1.2.2

overrides:
  "@hono/node-server@<2.0.5": ^2.0.5
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  browserslist@<=4.28.6: ^4.28.7
  esbuild@<0.28.1: ">=0.28.1"
